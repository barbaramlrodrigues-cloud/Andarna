    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-area">
                <svg class="dragon-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                    <path fill="currentColor" d="M19,14C20.5,12.5 21,10 20,8C19,6 16.5,5.5 15,6C13.5,4 11,3 9,4C6.5,5 5,7.5 5,10C3.5,10.5 2,12 2,14C2,16 3.5,17.5 5,18H19C20.5,18 22,16.5 22,15C22,14.5 21.8,14.2 21.5,14H19M7,12C7,10.9 7.9,10 9,10C10.1,10 11,10.9 11,12C11,13.1 10.1,14 9,14C7.9,14 7,13.1 7,12Z" />
                </svg>
                <h1>Andarna</h1>
            </div>
            <nav aria-label="Navegação Principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="estante.html">Minha Estante</a></li>
                    <li><a href="cadastro-livro.html">Adicionar Livro</a></li>
                    <li><a href="perfil.html" aria-current="page">Criar Conta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="main-container">
        <h2>Criar sua Conta</h2>
        <p>Registe o seu perfil para desbloquear a sua estante de leituras.</p>

        <form action="#" method="POST" class="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required>
            </div>
            <br>
            <div class="form-group">
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div class="form-group">
                <label for="senha">Senha:</label><br>
                <input type="password" id="senha" name="senha" required minlength="6">
            </div>
            <br>
            <div class="form-group">
                <button type="submit" class="btn-submit">Criar Conta</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Andarna. Projeto Integrador - Sistemas de Informação.</p>
    </footer>
</body>
</html>
