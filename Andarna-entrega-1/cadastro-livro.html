<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andarna — Adicionar Livro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-area">
                <svg class="dragon-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
                    <path fill="currentColor" d="M19,14C20.5,12.5 21,10 20,8C19,6 16.5,5.5 15,6C13.5,4 11,3 9,4C6.5,5 5,7.5 5,10C3.5,10.5 2,12 2,14C2,16 3.5,17.5 5,18H19C20.5,18 22,16.5 22,15C22,14.5 21.8,14.2 21.5,14H19M7,12C7,10.9 7.9,10 9,10C10.1,10 11,10.9 11,12C11,13.1 10.1,14 9,14C7.9,14 7,13.1 7,12Z" />
                </svg>
                <h1>Andarna</h1>
            </div>
            <nav aria-label="Navegação Principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="estante.html">Minha Estante</a></li>
                    <li><a href="cadastro-livro.html" aria-current="page">Adicionar Livro</a></li>
                    <li><a href="perfil.html">Criar Conta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="main-container">
        <h2>Cadastrar Novo Livro</h2>
        <p>Preencha os campos abaixo para registrar uma obra na plataforma.</p>

        <form action="#" method="POST" class="form-cadastro">
            <div class="form-group">
                <label for="titulo">Título do Livro:</label><br>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            <br>
            <div class="form-group">
                <label for="autor">Autor(a):</label><br>
                <input type="text" id="autor" name="autor" required>
            </div>
            <br>
            <div class="form-group">
                <label for="status">Status na Estante:</label><br>
                <select id="status" name="status" required>
                    <option value="">Selecione...</option>
                    <option value="lido">Lido</option>
                    <option value="lendo">Lendo</option>
                    <option value="releitura">Releitura</option>
                    <option value="quero-ler">Quero Ler</option>
                </select>
            </div>
            <br>
            <div class="form-group">
                <button type="submit" class="btn-submit">Cadastrar Livro</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Andarna. Projeto Integrador - Sistemas de Informação.</p>
    </footer>
</body>
</html>
